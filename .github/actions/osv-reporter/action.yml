name: OSV-Scanner reporter
description: Report OSV-Scanner results
inputs:
  scan-args:
    description: Arguments to osv-reporter, separated by new line
    required: true
runs:
  using: docker
  image: docker://ghcr.io/google/osv-scanner-action@sha256:d54770fe0b09493894e76a02aaed9f51a0513fa57c5186452a755d257b0068a6
  entrypoint: /root/osv-reporter
  args:
    - ${{ inputs.scan-args }}
