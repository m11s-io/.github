name: Build container image

on:
  workflow_call:
    inputs:
      source-ref:
        description: Exact caller repository revision to build
        type: string
        required: true
      context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
      repository:
        type: string
        required: true
      tags:
        description: Comma-separated image tags
        type: string
        required: true
      platforms:
        type: string
        default: linux/amd64
      cache-scope:
        type: string
        default: image
      cache-mode:
        type: string
        default: max
      free-space:
        type: boolean
        default: false
      description:
        type: string
        default: ''
      readme-file:
        type: string
        default: README.md
      node-version:
        description: Optional Node.js version to prepare before running the context hook
        type: string
        default: ''
      timeout-minutes:
        type: number
        default: 60
      push:
        description: Caller requests publishing; trusted caller event/ref is checked too
        type: boolean
        default: false
    secrets:
      DOCKER_USER:
        required: true
      DOCKER_PASS:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      IMAGE_PUBLISH: >-
        ${{ inputs.push && (
          (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.source-ref == github.sha) ||
          (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.source-ref == github.sha) ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == github.event.repository.default_branch && inputs.source-ref == github.event.workflow_run.head_sha) ||
          (github.event_name == 'release' && github.event.action == 'published' && inputs.source-ref == github.sha)
        ) }}
    permissions:
      contents: read
    steps:
      - name: Checkout caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - name: Set up Node.js
        if: ${{ inputs.node-version != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Prepare image build context
        run: |
          if [[ -f .github/prepare-image.sh ]]; then
            bash .github/prepare-image.sh
          fi
      - name: Free runner space
        if: ${{ inputs.free-space }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Set up QEMU
        if: ${{ contains(inputs.platforms, 'arm') }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: ${{ env.IMAGE_PUBLISH == 'true' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          pull: true
          push: ${{ env.IMAGE_PUBLISH == 'true' }}
          tags: ${{ inputs.tags }}
          cache-from: type=gha,scope=${{ inputs.cache-scope }}
          cache-to: type=gha,scope=${{ inputs.cache-scope }},mode=${{ inputs.cache-mode }}
      - name: Update Docker Hub repository overview
        if: ${{ env.IMAGE_PUBLISH == 'true' && inputs.description != '' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
          repository: ${{ inputs.repository }}
          short-description: ${{ inputs.description }}
          readme-filepath: ./${{ inputs.readme-file }}
          enable-url-completion: true
