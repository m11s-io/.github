name: Build container image

on:
  workflow_call:
    inputs:
      source-ref:
        description: Exact caller repository revision to build
        type: string
        required: true
      context:
        type: string
        required: true
      dockerfile:
        type: string
        required: true
      repository:
        type: string
        required: true
      tags:
        description: Comma-separated image tags
        type: string
        required: true
      platforms:
        type: string
        required: true
      cache-scope:
        type: string
        required: true
      cache-mode:
        type: string
        required: true
      free-space:
        type: boolean
        required: true
      description:
        type: string
        required: true
      readme-file:
        type: string
        required: true
      push:
        description: Caller requests publishing; trusted caller event/ref is checked too
        type: boolean
        required: true
    secrets:
      DOCKER_USER:
        required: true
      DOCKER_PASS:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - name: Prepare image build context
        run: |
          if [[ -f .github/prepare-image.sh ]]; then
            bash .github/prepare-image.sh
          fi
      - name: Free runner space
        if: ${{ inputs.free-space }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: ${{ inputs.push && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
          tags: ${{ inputs.tags }}
          cache-from: type=gha,scope=${{ inputs.cache-scope }}
          cache-to: type=gha,scope=${{ inputs.cache-scope }},mode=${{ inputs.cache-mode }}
      - name: Update Docker Hub repository overview
        if: ${{ inputs.push && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
          repository: ${{ inputs.repository }}
          short-description: ${{ inputs.description }}
          readme-filepath: ./${{ inputs.readme-file }}
          enable-url-completion: true
