name: OSV dependency scan

on:
  workflow_call:
    inputs:
      scan-args:
        description: Arguments for OSV source scanning, one per line
        type: string
        default: |-
          --recursive
          --allow-no-lockfiles
          ./
      upload-sarif:
        description: Upload results to GitHub code scanning when available
        type: boolean
        default: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    name: New dependency vulnerabilities
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/osv-scanner-reusable-pr.yml
    with:
      scan-args: ${{ inputs.scan-args }}
      fail-on-vuln: true
      upload-sarif: ${{ inputs.upload-sarif }}

  scan-full:
    name: All dependency vulnerabilities
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/osv-scanner-reusable.yml
    with:
      scan-args: ${{ inputs.scan-args }}
      fail-on-vuln: true
      upload-sarif: ${{ inputs.upload-sarif }}
